[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "renderlock"
version = "0.3.0b19"
description = "RenderLock: offline character and animation export from Deadlock replays"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26,<3", "boon-deadlock==0.15.0", "polars==1.44.1", "python-snappy==0.7.3"]

[project.scripts]
d2b = "agr.cli:main"
deadlock-agr = "agr.cli:main"
renderlock = "agr.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agr*"]

[tool.setuptools.package-data]
"agr.vendor" = ["THIRD_PARTY.md", "licenses/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
