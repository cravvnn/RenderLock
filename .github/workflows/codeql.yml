name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '27 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            os: ubuntu-24.04
            build-mode: none
          - language: rust
            os: ubuntu-24.04
            build-mode: none
          - language: csharp
            os: windows-2025
            build-mode: manual
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install .NET SDK
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Prepare pinned C# dependencies
        if: matrix.language == 'csharp'
        shell: pwsh
        run: python tools/codeql_build_helpers.py prepare --work "$env:RUNNER_TEMP/renderlock-codeql"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@f051dc808ef3645eb0d08647ec751634ec2304ac # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Compile every RenderLock C# helper
        if: matrix.language == 'csharp'
        shell: pwsh
        run: python tools/codeql_build_helpers.py build --work "$env:RUNNER_TEMP/renderlock-codeql"
      - name: Analyze
        uses: github/codeql-action/analyze@f051dc808ef3645eb0d08647ec751634ec2304ac # v4
        with:
          category: '/language:${{ matrix.language }}'
          output: codeql-results
